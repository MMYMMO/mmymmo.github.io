<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/playlist.js"></script>
<script>
/* 自動動画切替。0 = 無効 */
const CHANGE_INTERVAL = 0;
</script>
<style>
*{box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:sans-serif;
}

/* 上から 時計 / 動画1 / 動画2 */
.container{
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:repeat(3,1fr);
  width:100vw;
  height:100vh;
}

.cell{
  position:relative;
  overflow:hidden;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:0;
}

/* 時計はFX_Clock.htmlそのものを表示 */
.clock-cell iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#101318;
}

/* YouTube */
.video-cell iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  pointer-events:auto;
}

/* 動画の上下クリック領域 */
.clickTop,
.clickBottom{
  position:absolute;
  left:0;
  width:100%;
  z-index:20;
  cursor:pointer;
}

.clickTop{
  top:0;
  height:30%;
}

.clickBottom{
  bottom:0;
  height:30%;
}

.info{
  position:absolute;
  left:5px;
  top:5px;
  background:rgba(0,0,0,.6);
  color:#fff;
  padding:4px 8px;
  font-size:12px;
  display:none;
  z-index:10;
  pointer-events:none;
}

.video-cell:hover .info{display:block}
.video-cell:has(iframe) { outline-offset:-3px; }
.video-cell.dragging{outline:3px dashed #fff; outline-offset:-5px}

@media (max-width:700px){
  .info{font-size:10px}
}
</style>
</head>
<body>
<div class="container">

  <!-- 時計 -->
  <div class="cell clock-cell">
    <iframe
      id="frameClock"
      src="FX_Clock.html"
      title="FX World Clock"
      loading="eager">
    </iframe>
  </div>

  <!-- 動画1 -->
  <div class="cell video-cell">
    <iframe id="frameB" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div class="clickTop" onclick="prev('B')"></div>
    <div class="clickBottom" onclick="next('B')"></div>
    <div class="info" id="infoB"></div>
  </div>

  <!-- 動画2 -->
  <div class="cell video-cell">
    <iframe id="frameC" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div class="clickTop" onclick="prev('C')"></div>
    <div class="clickBottom" onclick="next('C')"></div>
    <div class="info" id="infoC"></div>
  </div>

</div>

<script>
if (!Array.isArray(playlist) || playlist.length === 0) {
  throw new Error('playlist.js に動画IDがありません。');
}

const index = {
  B: 0,
  C: Math.min(1, playlist.length - 1)
};

function randomIndex(exclude = -1) {
  if (playlist.length <= 1) return 0;
  let i;
  do {
    i = Math.floor(Math.random() * playlist.length);
  } while (i === exclude);
  return i;
}

/* 初期表示はB/Cで同じ動画にならないようにする */
index.B = randomIndex();
index.C = playlist.length >= 2 ? randomIndex(index.B) : index.B;

function update(type) {
  const videoId = playlist[index[type]];
  const controls = 0;
  const mute = 1;

  const url =
    `https://www.youtube.com/embed/${videoId}`
    + `?autoplay=1`
    + `&mute=${mute}`
    + `&loop=1`
    + `&playlist=${videoId}`
    + `&controls=${controls}`
    + `&rel=0`
    + `&playsinline=1`;

  document.getElementById(`frame${type}`).src = url;
  document.getElementById(`info${type}`).textContent = `${type} : ${videoId}`;
}

function next(type) {
  index[type] = (index[type] + 1) % playlist.length;
  update(type);
}

function prev(type) {
  index[type] = (index[type] - 1 + playlist.length) % playlist.length;
  update(type);
}

['B','C'].forEach(update);

/* YouTube URLを動画枠へドロップしたら、その動画を表示 */
function extractYouTubeId(value) {
  if (!value) return null;
  const text = value.trim();
  let url;
  try {
    url = new URL(text);
  } catch {
    return null;
  }

  const host = url.hostname.toLowerCase().replace(/^www\./, '');
  if (host === 'youtu.be') {
    return url.pathname.split('/').filter(Boolean)[0] || null;
  }
  if (!['youtube.com', 'm.youtube.com', 'music.youtube.com',
        'youtube-nocookie.com'].includes(host)) {
    return null;
  }

  if (url.pathname === '/watch') return url.searchParams.get('v');
  const parts = url.pathname.split('/').filter(Boolean);
  if (['embed', 'shorts', 'live', 'v'].includes(parts[0])) {
    return parts[1] || null;
  }
  return null;
}

function showDroppedVideo(type, videoId) {
  if (!videoId) return;
  const url =
    `https://www.youtube.com/embed/${videoId}`
    + `?autoplay=1&mute=1&loop=1&playlist=${videoId}`
    + `&controls=0&rel=0&playsinline=1`;
  document.getElementById(`frame${type}`).src = url;
  const info = document.getElementById(`info${type}`);
  info.textContent = `${type} : ${videoId}（ドロップ）`;
  info.style.display = 'block';
}

/*
 * アドレスバーからのドロップを確実に捕まえるため、document の
 * capture フェーズで先に処理する。受け取ったURLのドロップによる
 * 通常ページへの移動を preventDefault() で止める。
 */
document.addEventListener('dragover', event => {
  const cell = event.target.closest && event.target.closest('.video-cell');
  if (!cell) return;
  event.preventDefault();
  event.stopPropagation();
  cell.classList.add('dragging');
  if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
}, true);

document.addEventListener('dragleave', event => {
  const cell = event.target.closest && event.target.closest('.video-cell');
  if (cell && !cell.contains(event.relatedTarget)) {
    cell.classList.remove('dragging');
  }
}, true);

document.addEventListener('drop', event => {
  const cell = event.target.closest && event.target.closest('.video-cell');
  if (!cell) return;

  // URLをページ遷移として開かせず、動画枠へのドロップとして処理
  event.preventDefault();
  event.stopPropagation();
  cell.classList.remove('dragging');

  const type = cell.querySelector('iframe').id === 'frameB' ? 'B' : 'C';
  const data = event.dataTransfer;
  const candidates = data ? [
    data.getData('text/uri-list'),
    data.getData('text/plain'),
    data.getData('URL')
  ] : [];

  for (const candidate of candidates) {
    const line = candidate.split(/\r?\n/).find(s => s.trim() && !s.trim().startsWith('#'));
    const videoId = extractYouTubeId(line || '');
    if (videoId) {
      showDroppedVideo(type, videoId);
      return;
    }
  }

  const info = document.getElementById(`info${type}`);
  info.textContent = `${type} : URLを取得できませんでした。YouTubeのアドレスバーから動画枠へドロップしてください`;
  info.style.display = 'block';
}, true);

// 枠をまたいだときにドラッグ中の表示を消すための補助処理
document.querySelectorAll('.video-cell').forEach(cell => {
  cell.addEventListener('dragend', () => cell.classList.remove('dragging'));
});
/* 任意の自動切替 */
if (CHANGE_INTERVAL > 0) {
  setInterval(() => {
    const types = ['B','C'];
    const type = types[Math.floor(Math.random() * types.length)];
    index[type] = randomIndex(index[type]);
    update(type);
  }, CHANGE_INTERVAL);
}
</script>
</body>
</html>
